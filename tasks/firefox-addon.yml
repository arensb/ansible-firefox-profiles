---
# Parameters:
# - addon_slug: "slug" for the addon to install, e.g., "adblock-plus".
- debug: var=profiles

# See also
# https://stackoverflow.com/questions/37728865/install-webextensions-on-firefox-from-the-command-line
#	slug=adblock-plus
# - Get information about the add-on:
#   https://services.addons.mozilla.org/api/v4/addons/addon/${slug}/

- name: "profile {{ profile }}: addon {{ addon_slug }}: Look up information"
  vars:
    info_base: "https://services.addons.mozilla.org/api/v4/addons/addon"
  uri:
    url: "{{ info_base }}/{{ addon_slug }}/"
    return_content: yes
    # body_format: json
  register: addon_info
  check_mode: no

# Make sure the installation directory exists:
# Linux:
#   $HOME/.mozilla/firefox/<profile-dir>/extensions/
# MacOS:
#   $HOME/Library/Application Support/Firefox/Profiles/<profile-dir>/extensions

# XXX - This fails if the profile directory was created during this
# role execution. Although firefox-profile.yml reruns `profile:' when
# it creates the profile, apparently that's not enough for the
# `profile_subdir' variable further down, which still uses the default "abcd1234" value.
- name: "Profile {{ profile }}: addon {{ addon_slug }}: Create extension directory"
  vars:
    ext_dir: "{{ profile_subdir | ansible.builtin.basename }}/extensions"
  file:
    path: "{{ ext_dir }}"
    state: directory
    owner: "{{ firefox_owner | default(ansible_facts['user_id'])}}"
    group: "{{ firefox_group | default(ansible_facts['effective_group_id'])}}"
    mode: '0755'

# Download each file
- name: "Profile {{ profile }}: addon {{ addon_slug }}: download extension file"
  vars:
    # Extract slug
    slug: "{{ addon_info.json | json_query('slug') }}"
    # Extract guid
    guid: "{{ addon_info.json | json_query('guid') }}"
    basename: "{{ guid }}.xpi"
    ext_dir: "{{ profile_subdir | ansible.builtin.basename }}/extensions"
  uri:
    url: "{{ item.url }}"
    dest: "{{ ext_dir }}/{{ basename }}"
    creates: "{{ profile_subdir }}/extensions/{{ basename }}"
    owner: "{{ firefox_owner | default(ansible_facts['user_id'])}}"
    group: "{{ firefox_group | default(ansible_facts['effective_group_id'])}}"
    mode: '0644'
    # addons.mozilla.org returns status "304: Not Modified", which
    # says it's okay to use a cached version. The uri module chokes on
    # this, and I don't think there's a cached version we can reliably
    # use. So force downloading.
    force: yes
  with_items: "{{ addon_info.json | json_query('current_version.files') | list }}"
  loop_control:
    label: "{{ slug }}"
