---
# Create a Firefox profile

# Set profile_subpath: directory under profile_dir where profiles are put.
# On Linux boxes, this is "", while on Macs, it's "/Profiles".
- name: Get the profile subdirectory
  block:
    - set_fact:
        profile_subpath: ""
    - set_fact:
        profile_subpath: "/Profiles"
      when: ansible_os_family == "Darwin"
  when: profile_subpath is not defined

# XXX - Ought to be able to delete profiles, or rebuild them.
# Unfortunately,
# https://developer.mozilla.org/en-US/docs/Mozilla/Command_Line_Options
# doesn't list a way to do this.
# - name: "Delete profile {{ profile }}"
#   command:
#     - "{{ firefox_cmd }}"
#     - "-headless"
#     - "-no-remote"
#     - "-DeleteProfile"
#     - "{{ profile }}"
#   register: profile_status
#   when:
#     - profile_state == "absent"
#
# The manual way to do this would be to tweak the profiles.ini file:
# delete (or comment out) the entire stanza with the profile, and
# recursively delete its directory.
#
# - If deleting the default profile, pick a different one to be the default.
#   - If there are no other profiles, throw an error.
#   - Set "Default=1" on some other profile. Maybe the first one that isn't
#     the current one.
#   - Set "Default=<new default profile id>" on [InstallNNN], if it exists.
#     - Also make this change in installs.ini: that's a backup of the
#       Install section:
#       https://support.mozilla.org/en-US/kb/understanding-depth-profile-installation
# - Get the profile directory.
# - Delete the stanza
# - If desired, delete the profile directory.

- name: "Create profile {{ profile }}"
  block:
    - name: "Tell Firefox to create profile {{ profile }}"
      command:
        argv:
          - "{{ firefox_cmd }}"
          - "-headless"
          - "-no-remote"
          - "-CreateProfile"
          - "{{ profile }}"
        # XXX - This registers as "not changed", even when it has run
        # and created a profile directory. To get it to return
        # changed/unchanged properly, need to pass the "creates"
        # parameter. But we don't know the exact name of the directory
        # that will be created, so we need to pass a glob. This was
        # added in 2.0, so need to add that as a requirement.
        creates: "{{ firefox_dir }}{{ profile_subpath }}/*.{{ profile }}"
      when: profiles.profiles[profile] is not defined
      register: create_profile
    - name: "Reread profiles.ini"
      profile:
      when: create_profile is changed

# Install addons (and themes)
- name: "Profile {{ profile }}: Install addons"
  vars:
    # XXX - 'path' is relative to profile_dir only if also 'isrelative=1'.
    # If 'isrelative=0', then 'path' is an absolute path.
    profile_subdir: "{{ firefox_dir }}/{{ profiles.profiles[profile].path | default('abcd1234'+profile) }}"
  include_tasks: firefox-addon.yml
  with_items: "{{ addons }}"
  loop_control:
    loop_var: addon_slug

- name: "Profile {{ profile }}: Tweak preferences"
  vars:
    profile_subdir: "{{ firefox_dir }}/{{ profiles.profiles[profile].path | default('dummy') }}"
  lineinfile:
    path: "{{ profile_subdir }}/prefs.js"
    regexp: '^user_pref\(\"{{ item }}\",.*'
    line: 'user_pref("{{ item.key }}", {{ item.value }});'
    create: yes
    owner: "{{ firefox_owner | default(ansible_facts['user_id'])}}"
    group: "{{ firefox_group | default(ansible_facts['effective_group_id'])}}"
    mode: '0644'
    # If the value is "null", then remove this line altogether.
    # Useful for cases like "network.proxy.type: 5": 5 is the default,
    # so Firefox removes the line entirely.
    state: "{{ 'absent' if item.value == None else 'present' }}"
  loop: "{{ prefs | dict2items }}"
  when:
    - prefs is defined
    - prefs != ""
    - prefs.keys()|length > 0

# Install security devices
- name: Install security devices
  include_tasks: security-device.yaml
  with_items: "{{ security_devices }}"
  loop_control:
    loop_var: security_device
  when:
    - security_devices is defined
    - security_devices != ""
    - security_devices | length > 0

# Tweak protocol handlers.
#
# The caller may have given us multiple protocols to add, and we're
# going to include 'firefox-handlers.yml' for each one. But we're only
# going to read the initial protocol list once, out here.
#
# And if the list is modified, it'll only be changed at the end, by a
# handler in ../handlers.
- name: Read existing protocol handlers
  # Ansible can parse JSON variable files, so that seems like the
  # simplest way to slurp in this data.
  include_vars:
    file: "{{ firefox_dir }}/{{ profiles.profiles[profile].path | default('dummy') }}/handlers.json"
    name: "ff_handlers"
  when:
    - protocols is defined
    - protocols != ""
    - protocols | length > 0

# Loop over the list of protocols we've been given, and include
# 'firefox-handlers.yml' for each one.
- name: Manage protocol handlers
  include_tasks: firefox-handlers.yml
  with_items: "{{ protocols }}"
  loop_control:
    loop_var: protocol
  when:
    - protocols is defined
    - protocols != ""
    - protocols | length > 0
