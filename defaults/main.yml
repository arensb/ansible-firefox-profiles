---
# defaults file for roles/firefox
addons: []
security_devices: []
prefs: {}

# By default, assume that 'firefox' is in $PATH.
firefox_cmd: firefox

# Root of Firefox configuration
firefox_dir: "{{ lookup('env', 'HOME') }}/.mozilla/firefox"

# XXX - Not implemented yet
# profile_state can be 'present' (create the profile if it doesn't exist)
# or 'absent' (delete the profile if it exists)
# profile_state: present

# Path to profiles.ini
#firefox_profile_path: "{{ lookup('env', 'HOME')}}/.mozilla/firefox/profiles.ini"
firefox_profile_path: "{{ firefox_dir }}/profiles.ini"

# Under Linux, profiles go in the same directory as "profiles.ini".
# Under MacOS, there's a "Profiles" directory on the same level as
# "profiles.ini", that profiles go in. `firefox_profile_subpath' is
# keyed by ansible_facts['os_family'] and gives this subdirectory, if
# any.
firefox_profile_subpath:
  "Darwin": "/Profiles"
  "default": ""

# Owner and group of the Firefox directory
firefox_owner: "{{ ansible_facts['user_id'] }}"
firefox_group: "{{ ansible_facts['effective_group_id'] }}"
